# structure.md의 배포 방식을 위한 템플릿 워크플로입니다.
# main 브랜치에 push하면 3개 앱(admin/api/website)을 빌드하고, 시크릿이 설정되어 있으면
# SSH로 서버에 배포합니다. deploy job은 SSH_HOST/SSH_USER/SSH_KEY 시크릿이 없으면
# 자동으로 건너뜁니다 — 실제 서버가 준비되면 리포지토리 Settings > Secrets에 등록해주세요.
name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run build -w @cms/blocks
      - run: npm run prisma:generate -w @cms/api
      - run: npm run build -w @cms/api
      - run: npm run build -w @cms/admin
      - run: npm run build -w @cms/website
      - run: npm run lint

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 시크릿이 없는 저장소(예: 이 템플릿을 처음 fork/생성한 상태)에서는 이 job을 건너뜁니다.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /srv/cms
            git pull origin main
            npm ci
            npm run build -w @cms/blocks
            npm run prisma:generate -w @cms/api
            npm run prisma:migrate -w @cms/api -- --skip-generate
            npm run build -w @cms/api
            npm run build -w @cms/admin
            npm run build -w @cms/website
            pm2 restart cms-api cms-admin cms-website || pm2 start ecosystem.config.js
