# structure.mdのデプロイ方式に沿ったテンプレートワークフローです。
# mainブランチにpushすると3つのアプリ(admin/api/website)をビルドし、シークレットが
# 設定されていればSSHでサーバーにデプロイします。deploy jobはSSH_HOST/SSH_USER/SSH_KEY
# シークレットがないと自動的にスキップされます — 実サーバーが用意できたらリポジトリの
# Settings > Secretsに登録してください。
name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run build -w @cms/blocks
      - run: npm run prisma:generate -w @cms/api
        env:
          # prisma generateは実際にはDBに接続せずスキーマだけを読むが、
          # prisma.config.tsがロード時点でDATABASE_URLを要求するのでダミー値を入れておく。
          DATABASE_URL: "postgresql://user:password@localhost:5432/db"
      - run: npm run build -w @cms/api
      - run: npm run build -w @cms/admin
      - run: npm run build -w @cms/website
      - run: npm run lint

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # シークレットがないリポジトリ(例: このテンプレートをfork/作成した直後の状態)ではこのjobをスキップします。
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /srv/cms
            git pull origin main
            npm ci
            npm run build -w @cms/blocks
            npm run prisma:generate -w @cms/api
            npm run prisma:migrate -w @cms/api -- --skip-generate
            npm run build -w @cms/api
            npm run build -w @cms/admin
            npm run build -w @cms/website
            pm2 restart cms-api cms-admin cms-website || pm2 start ecosystem.config.js
